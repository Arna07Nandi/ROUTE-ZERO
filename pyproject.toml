[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "routezero"
version = "0.2.1"
description = "Zero-dependency local-first LLM cost-routing proxy and multi-file code auditor."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
routezero = "routezero.cli:main"

[tool.setuptools.packages.find]
include = ["routezero*"]
